name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --build
      - run: npx vitest run
      - run: npm run smoke
      - name: npm README is in sync
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node scripts/sync-readme.mjs && git diff --exit-code packages/cli/README.md
      - run: npm run check:pack
